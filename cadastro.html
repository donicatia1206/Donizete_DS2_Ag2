<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Lojas Brincos e Companhia</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body class="w3-light-grey">

<div class="w3-container w3-content w3-padding-64" style="max-width:600px">
    <div class="w3-card-4 w3-white w3-round-large">
        <div class="w3-container w3-teal w3-round-large">
            <h2>Cadastro de Novo Colaborador</h2>
            <p>Lojas Brincos e Companhia</p>
        </div>

        <form action="processaCadastro.php" method="POST" class="w3-container w3-padding-16">
            <p>
                <label class="w3-text-teal"><b>Nome Completo:</b></label>
                <input class="w3-input w3-border w3-round" type="text" name="nome1" required>
            </p>

            <p>
                <label class="w3-text-teal"><b>Idade:</b></label>
                <input class="w3-input w3-border w3-round" type="number" name="idade2" required>
            </p>

            <p>
                <label class="w3-text-teal"><b>Profissão:</b></label>
                <input class="w3-input w3-border w3-round" type="text" name="profissao3" required>
            </p>

            <p>
                <label class="w3-text-teal"><b>Salário Pretendido (R$):</b></label>
                <input class="w3-input w3-border w3-round" type="number" step="0.01" name="salario4" required>
            </p>

            <p>
                <label class="w3-text-teal"><b>Experiência Anterior:</b></label>
                <textarea class="w3-input w3-border w3-round" name="experiencia5" rows="4" required></textarea>
            </p>

            <p class="w3-center">
                <button type="submit" class="w3-btn w3-teal w3-round-large">Cadastrar Colaborador</button>
            </p>
        </form>
    </div>
</div>

</body>
</html>
